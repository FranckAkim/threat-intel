[project]
name = "threat-intel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "elasticsearch==8.11.0",
    "fastapi>=0.136.1",
    "hatching>=0.0.1",
    "httpx>=0.28.1",
    "kafka-python>=2.3.1",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.46.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/threat_intel"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
